<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg2)"/>
  <!-- SDLC stages -->
  <rect x="50" y="60" width="140" height="50" rx="8" fill="#3b82f6" opacity="0.4"/>
  <rect x="220" y="60" width="140" height="50" rx="8" fill="#8b5cf6" opacity="0.4"/>
  <rect x="390" y="60" width="140" height="50" rx="8" fill="#f59e0b" opacity="0.4"/>
  <rect x="560" y="60" width="140" height="50" rx="8" fill="#22c55e" opacity="0.4"/>
  <text x="120" y="90" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">CODE</text>
  <text x="290" y="90" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">BUILD</text>
  <text x="460" y="90" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">TEST</text>
  <text x="630" y="90" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">DEPLOY</text>
  <!-- Arrows between -->
  <text x="195" y="90" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16">&#x2192;</text>
  <text x="365" y="90" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16">&#x2192;</text>
  <text x="535" y="90" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16">&#x2192;</text>
  <!-- Security badges -->
  <text x="400" y="170" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="22" font-weight="bold">Security Gates</text>
  <circle cx="120" cy="220" r="30" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="226" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="22">SAST</text>
  <circle cx="290" cy="220" r="30" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="290" y="226" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="22">SCA</text>
  <circle cx="460" cy="220" r="30" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="460" y="226" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="22">DAST</text>
  <circle cx="630" cy="220" r="30" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="630" y="226" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="22">RASP</text>
  <!-- Bottom row -->
  <text x="400" y="300" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14">DevOps + Security = DevSecOps</text>
  <text x="400" y="330" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">Shift-Left — Find vulnerabilities early, not in production</text>
  <line x1="200" y1="370" x2="600" y2="370" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
</svg>
