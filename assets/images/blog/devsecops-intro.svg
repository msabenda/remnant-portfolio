<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Shield icon -->
  <circle cx="400" cy="180" r="80" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="400" y="195" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="48">&#x1F6E1;</text>
  <!-- CI/CD Pipeline arrows -->
  <line x1="120" y1="320" x2="680" y2="320" stroke="#475569" stroke-width="2"/>
  <circle cx="160" cy="320" r="15" fill="#22c55e" opacity="0.3"/>
  <circle cx="300" cy="320" r="15" fill="#3b82f6" opacity="0.3"/>
  <circle cx="440" cy="320" r="15" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="580" cy="320" r="15" fill="#f59e0b" opacity="0.3"/>
  <text x="160" y="325" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Plan</text>
  <text x="300" y="325" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Build</text>
  <text x="440" y="325" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Test</text>
  <text x="580" y="325" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Deploy</text>
  <!-- Lock in center -->
  <rect x="360" y="260" width="80" height="50" rx="5" fill="#22c55e" opacity="0.8"/>
  <text x="400" y="290" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="18">SECURE</text>
  <text x="400" y="380" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14">DevSecOps Pipeline</text>
</svg>
