<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From system requirements to a reliable product</title>
  <desc id="desc">A five-stage development flow connecting requirements, tool selection, integration, testing, and operation.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2f69ff"/></marker></defs>
  <rect width="1600" height="900" fill="#f5f3ee"/>
  <text x="100" y="130" fill="#111318" font-family="Arial, sans-serif" font-size="62" font-weight="700">From SDK to dependable system</text>
  <text x="100" y="190" fill="#50545c" font-family="Arial, sans-serif" font-size="28">Choose tools around the system you need to build.</text>
  <g fill="none" stroke="#2f69ff" stroke-width="8" marker-end="url(#arrow)">
    <path d="M330 440H410"/><path d="M620 440H700"/><path d="M910 440H990"/><path d="M1200 440H1280"/>
  </g>
  <g font-family="Arial, sans-serif">
    <g><rect x="80" y="310" width="250" height="260" rx="18" fill="#ffffff" stroke="#c8cbd2" stroke-width="3"/><circle cx="205" cy="385" r="38" fill="#e9efff"/><path d="M187 385h36M205 367v36" stroke="#2f69ff" stroke-width="7" stroke-linecap="round"/><text x="205" y="475" text-anchor="middle" fill="#111318" font-size="28" font-weight="700">Requirements</text><text x="205" y="520" text-anchor="middle" fill="#60646c" font-size="20">Users, data, risks</text></g>
    <g><rect x="410" y="310" width="210" height="260" rx="18" fill="#ffffff" stroke="#c8cbd2" stroke-width="3"/><rect x="481" y="351" width="68" height="68" rx="12" fill="#e9efff"/><path d="M497 376l-12 9 12 9M533 376l12 9-12 9" fill="none" stroke="#2f69ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="515" y="475" text-anchor="middle" fill="#111318" font-size="28" font-weight="700">Select</text><text x="515" y="510" text-anchor="middle" fill="#60646c" font-size="20">API, SDK, library</text><text x="515" y="538" text-anchor="middle" fill="#60646c" font-size="20">framework, CLI</text></g>
    <g><rect x="700" y="310" width="210" height="260" rx="18" fill="#ffffff" stroke="#c8cbd2" stroke-width="3"/><circle cx="805" cy="385" r="39" fill="#e5f7ef"/><path d="M781 385h48M805 361v48" stroke="#13845b" stroke-width="7" stroke-linecap="round"/><text x="805" y="475" text-anchor="middle" fill="#111318" font-size="28" font-weight="700">Integrate</text><text x="805" y="510" text-anchor="middle" fill="#60646c" font-size="20">Use an adapter</text><text x="805" y="538" text-anchor="middle" fill="#60646c" font-size="20">Protect credentials</text></g>
    <g><rect x="990" y="310" width="210" height="260" rx="18" fill="#ffffff" stroke="#c8cbd2" stroke-width="3"/><circle cx="1095" cy="385" r="39" fill="#fff0dd"/><path d="M1076 386l13 13 27-31" fill="none" stroke="#c16718" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="1095" y="475" text-anchor="middle" fill="#111318" font-size="28" font-weight="700">Verify</text><text x="1095" y="510" text-anchor="middle" fill="#60646c" font-size="20">Test contracts,</text><text x="1095" y="538" text-anchor="middle" fill="#60646c" font-size="20">security, failures</text></g>
    <g><rect x="1280" y="310" width="240" height="260" rx="18" fill="#111318"/><path d="M1363 412V372M1400 412V350M1437 412V384" stroke="#85a8ff" stroke-width="12" stroke-linecap="round"/><text x="1400" y="475" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">Operate</text><text x="1400" y="510" text-anchor="middle" fill="#c9cbd0" font-size="20">Logs, metrics,</text><text x="1400" y="538" text-anchor="middle" fill="#c9cbd0" font-size="20">updates, alerts</text></g>
    <rect x="80" y="665" width="1440" height="100" rx="16" fill="#e9efff"/>
    <text x="800" y="727" text-anchor="middle" fill="#173b9d" font-size="27" font-weight="700">Understand the abstraction • isolate dependencies • test failure paths • observe production</text>
  </g>
</svg>
